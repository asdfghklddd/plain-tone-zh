<!-- 账户设置页（自拟样稿，改后） -->
<h1>账户设置</h1>

<section>
  <h2>个人资料</h2>
  <label for="nick">昵称</label>
  <input id="nick" type="text">
  <label for="mail">邮箱</label>
  <input id="mail" type="email">
  <button>保存资料</button>
</section>

<section>
  <h2>通知</h2>
  <label>接收方式
    <select><option>每日摘要</option><option>实时推送</option></select>
  </label>
</section>

<section>
  <h2>账单
    <button class="info" aria-label="计费周期说明" aria-describedby="tip-cycle">ⓘ</button>
    <span role="tooltip" id="tip-cycle">每月 1 日按上月用量出账</span>
  </h2>
  <p>专业版 ¥299/年，下次扣款 11 月 1 日</p>
  <button class="primary">支付 ¥299</button>
  <p>将从尾号 4821 的银行卡扣款 ¥299，开具电子发票。</p>
</section>

<section>
  <h2>删除账户</h2>
  <p>删除后 30 天内可登录恢复，30 天后所有项目和账单记录永久清除。</p>
  <button class="danger">删除账户</button>
</section>
