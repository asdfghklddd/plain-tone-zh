<!-- 账户设置页（自拟样稿，改前） -->
<h1>账户设置</h1>
<p class="subtitle">一切尽在掌握，让账户管理更简单</p>
<p class="intro">在这里你可以管理你的个人资料、通知和账单信息。点击此处查看使用教程。</p>

<section>
  <h2>个人资料</h2>
  <p class="hint">本模块用于修改你的昵称和邮箱。</p>
  <input type="text" placeholder="请输入您的昵称">
  <input type="email" placeholder="请输入您的邮箱地址">
  <button>确定</button>
</section>

<section>
  <h2>通知</h2>
  <p class="hint">在此您可以选择接收哪些通知。</p>
  <select><option>每日摘要</option><option>实时推送</option></select>
</section>

<section>
  <h2>账单</h2>
  <p class="hint">管理你的套餐与付款方式。</p>
  <button class="icon"><svg viewBox="0 0 16 16"></svg></button>
  <button class="primary">立即支付</button>
</section>

<section>
  <h2>危险区域</h2>
  <p class="hint">请谨慎操作。</p>
  <button class="danger">删除账户</button>
</section>
